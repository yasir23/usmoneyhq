services:
  web:
    build: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usmoneyhq.rule=Host(`usmoneyhq.com`) || Host(`www.usmoneyhq.com`)"
      - "traefik.http.routers.usmoneyhq.entrypoints=websecure"
      - "traefik.http.routers.usmoneyhq.tls=true"
      - "traefik.http.routers.usmoneyhq.tls.certresolver=letsencrypt"
      - "traefik.http.services.usmoneyhq.loadbalancer.server.port=3000"
