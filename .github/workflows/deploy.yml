name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare standalone bundle
        run: |
          rm -rf /tmp/app
          mkdir -p /tmp/app
          cp -R .next/standalone/. /tmp/app/
          cp -R .next/static /tmp/app/.next/static
          echo "--- bundle .next contents ---"
          ls /tmp/app/.next | head -20
          test -f /tmp/app/.next/BUILD_ID && echo "BUILD_ID OK" || { echo "BUILD_ID MISSING"; exit 1; }
          cd /tmp/app && tar czf /tmp/usmoneyhq.tar.gz .
          echo "--- bundle size ---"
          ls -la /tmp/usmoneyhq.tar.gz

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "mkdir -p /opt/usmoneyhq"
          SSHPASS="$VPS_PASSWORD" sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/usmoneyhq.tar.gz "$VPS_USER@$VPS_HOST:/opt/usmoneyhq/"
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "bash -s" < scripts/remote_deploy.sh

      - name: Diagnose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "echo '=== server/pages ==='; ls /opt/usmoneyhq/.next/server/pages 2>/dev/null | head -20; echo '=== app 3001 curl ==='; curl -s -m 5 http://127.0.0.1:3001/ | head -c 200; echo; echo '=== nginx 80 curl ==='; curl -s -m 5 -H 'Host: usmoneyhq.com' http://127.0.0.1/ | head -c 200; echo; echo '=== listeners ==='; ss -tlnp 2>/dev/null | grep -E ':80 |:3001 '; echo '=== pm2 describe ==='; pm2 describe usmoneyhq 2>/dev/null | grep -E 'exec cwd|script path|status|restarts|unstable' | head -8"
