name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare standalone bundle
        run: |
          rm -rf /tmp/app
          mkdir -p /tmp/app
          cp -R .next/standalone/. /tmp/app/
          cp -R .next/static /tmp/app/.next/static
          # .next/standalone/ already ships its own public/ (traced data files land
          # there), so `cp -R public /tmp/app/public` copies INTO that directory and
          # leaves the served /app/public/* frozen at an old revision. Copy the
          # CONTENTS so every public/ file is refreshed on each deploy.
          mkdir -p /tmp/app/public
          cp -R public/. /tmp/app/public/
          test -f /tmp/app/public/llms.txt && test -f /tmp/app/public/ads.txt \
            || { echo "PUBLIC COPY FAILED — /tmp/app/public missing expected files"; ls -la /tmp/app/public | head; exit 1; }
          cp Dockerfile docker-compose.yml /tmp/app/
          echo "--- bundle .next contents ---"
          ls /tmp/app/.next >/dev/null || exit 1
          test -f /tmp/app/.next/BUILD_ID && echo "BUILD_ID OK" || { echo "BUILD_ID MISSING"; exit 1; }
          cd /tmp/app && tar czf /tmp/usmoneyhq.tar.gz .
          echo "--- bundle size ---"
          ls -la /tmp/usmoneyhq.tar.gz

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "mkdir -p /opt/usmoneyhq"
          SSHPASS="$VPS_PASSWORD" sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/usmoneyhq.tar.gz "$VPS_USER@$VPS_HOST:/opt/usmoneyhq/"
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "bash -s" < scripts/remote_deploy.sh

      - name: Diagnose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          # The previous version of this step printed `docker ps` and a curl, but never
          # read the container's own logs — so a container that reports "Up" while
          # serving nothing produced a green job and a 522 at the edge. Logs, exit
          # code, restart count and OOM flag are the evidence that was missing.
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          echo '=== docker ps -a ==='
          docker ps -a --format '{{.Names}} | {{.Status}} | {{.Ports}}' | head -10
          echo '=== container state ==='
          docker inspect usmoneyhq-web-1 --format 'restarts={{.RestartCount}} oomKilled={{.State.OOMKilled}} exitCode={{.State.ExitCode}} startedAt={{.State.StartedAt}}' 2>&1 || echo 'inspect failed'
          echo '=== container ip ==='
          docker inspect usmoneyhq-web-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>&1 || true
          echo '=== logs (last 120 lines) ==='
          docker logs --tail 120 usmoneyhq-web-1 2>&1 || echo 'logs unavailable'
          echo '=== local curl ==='
          curl -s -o /dev/null -w 'host:3000 -> %{http_code}\n' -m 8 http://127.0.0.1:3000/ || echo 'host:3000 unreachable'
          echo '=== compose file in use ==='
          sed -n '1,40p' /opt/usmoneyhq/docker-compose.yml 2>&1 || true
          REMOTE
